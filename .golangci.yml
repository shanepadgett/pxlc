version: "2"

linters:
  default: standard
  enable:
    # The standard set already includes staticcheck and unused. These add
    # high-signal checks for dead parameters, discarded assignments, and
    # suspicious control flow without imposing a house style.
    - gocritic
    - nilerr
    - unconvert
    - unparam
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  # Keep silent-runner failure reports short enough to act on. Re-run after
  # each repair to expose the next group rather than flooding agent context.
  max-issues-per-linter: 10
  max-same-issues: 3

output:
  formats:
    text:
      path: stderr
      print-issued-lines: false
      print-linter-name: true
      colors: false
