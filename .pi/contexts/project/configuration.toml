[repository-ignore]
description = "Repository-wide ignored operating-system files."
files = [".gitignore"]

[markdown-quality]
description = "Repository Markdown linting policy and excluded generated or transient paths."
files = [".markdownlint-cli2.jsonc"]

[task-runner]
description = "Development tool versions and repeatable repository tasks, including Go validation and the pxlc-crush-sheet generated-sheet reduction command."
files = ["mise.toml"]

[go-module]
description = "Go module identity and language-version declaration."
files = ["go.mod"]

[go-quality]
description = "Go linting and formatting policy."
files = [".golangci.yml"]

[agent-workflow]
description = "Tau agent command integrations for repository checks."
files = [".pi/tau/settings.json"]
